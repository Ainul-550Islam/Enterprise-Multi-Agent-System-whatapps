# PURPOSE:
# Declares the gRPC agent-bridge adapter crate.
#
# Depends on the generated `mas.api.v1` stubs and on `mas-execution` for the
# port it implements. Keeps tonic/prost as the only transport stack, so the
# bridge speaks the same protobuf contract as the rest of the platform.

[package]
name = "mas-ai-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "gRPC adapter implementing mas-execution's AgentBridge port against the Python AI Orchestrator."
license = "Proprietary"
publish = false

[lib]
name = "mas_ai_bridge"
path = "src/lib.rs"

[dependencies]
mas-common = { workspace = true }
mas-domain = { workspace = true }
mas-execution = { workspace = true }
mas-orchestration = { workspace = true }
mas-security = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
prost = "0.13"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tonic = { version = "0.13", default-features = false, features = [
    "channel",
    "codegen",
    "prost",
    "transport",
    "tls-ring",
    "tls-native-roots",
    "tls-webpki-roots",
] }
tracing = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.13", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3"

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
