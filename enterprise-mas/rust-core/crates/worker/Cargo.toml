# PURPOSE: The `mas-worker` crate manifest.
#
# Owning layer: `mas-worker`.
#
# Production responsibility: declare the consumer plane's dependencies,
# including `mas-application` for the durable execution port — the worker must
# settle through the same atomic units the submission path uses, so it cannot
# grow a second lifecycle. `mas-application` depends only on common/domain/
# contracts/events, so this adds no dependency cycle.
#
# It must NOT:
#   • depend on `mas-execution`'s in-memory test doubles in a non-dev target;
#   • add a dependency that inverts the layer order;
#   • enable a feature that substitutes an in-memory production path.

[package]
name = "mas-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Task consumer process: leases, retries, heartbeats, graceful shutdown"
license = "Proprietary"

[lib]
name = "mas_worker"
path = "src/lib.rs"

[dependencies]
mas-common = { workspace = true }
mas-domain = { workspace = true }
mas-contracts = { workspace = true }
# mas-application is pulled in for the durable execution port: the worker must
# settle through the same atomic units the submission path uses, so it cannot
# grow a second lifecycle. mas-application depends only on common/domain/
# contracts/events, so this adds no dependency cycle.
mas-application = { workspace = true }
mas-messaging = { workspace = true }
mas-scheduling = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["net", "signal", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
testutils = []

[lints]
workspace = true

[[bench]]
name = "root_backoff_bench"
path = "../../benches/backoff_bench.rs"
harness = false
