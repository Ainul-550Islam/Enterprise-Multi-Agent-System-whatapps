# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION overlay (MAS_ENV=production). Merges over default.toml.
#
# ⚠️  GUARDRAILS — binaries refuse to boot when these hold:
#   * database.url empty           → in-memory fallback is FORBIDDEN here
#   * server.dev_tokens non-empty  → static tokens are a dev/test artifact
#   * scheduler.api_bearer set     → production service auth comes from env
#     MAS_SCHEDULER_API_TOKEN directly, never from a checked-in file
#   * metrics listener public      → scraping endpoint must not be world-open
#
# Everything below is sized for a medium single-region deployment; tune per
# SLO measurements (benches/ has the throughput floor):
#   * api p99 submit+start               <  250 ms
#   * scheduler tick drain (100 due)     <  1 s
#   * worker settle latency (steady)     <  50 ms / msg
# ─────────────────────────────────────────────────────────────────────────────
environment = "production"

[server]
http_addr = "0.0.0.0:8080"
grpc_addr = "0.0.0.0:50051"
body_limit_kib = 256
dev_tokens = ""

[scheduler]
# Behind an internal LB: only this host's loopback is too tight for probes,
# but the completion route is internal-plane; protect with network policy.
completion_addr = "0.0.0.0:8090"
replica_id = "scheduler-prod-1"
tick_interval_ms = 5000
recover_on_start = true
error_backoff_cap_ms = 60000
# api_base_url comes from MAS_SCHEDULER_API_URL (service discovery insert).

[worker]
consumer_name = "tasks-prod"
batch_size = 25
ack_wait_ms = 30000
poll_interval_ms = 100
lease_ttl_ms = 45000
max_in_flight = 64
drain_timeout_ms = 60000
worker_name = "worker-prod-1"
# The production worker is a real AI execution worker, not an empty consumer.
# Bridge endpoint/token/signing key are supplied via the MAS_AI_BRIDGE_* env vars.
handlers = "execution.run"
retry_base_ms = 500
retry_cap_ms = 30000
retry_max_deliver = 10

[database]
# Empty here on purpose: production reads MAS_DATABASE_URL from env; the
# guardrail above stops boot without it.
url = ""
# Dedicated least-privilege role/session URLs. These are intentionally empty:
# API startup refuses to compose public inbound webhooks, outbound relay,
# notification delivery, or OAuth callbacks without separate least-privilege
# role sessions. All values are supplied through MAS_DATABASE_*_URL at deploy.
inbound_url = ""
integrations_url = ""
notifications_url = ""
oauth_url = ""
oauth_refresh_url = ""
max_connections = 32
connect_timeout_ms = 5000

# Vault credentials are supplied through MAS_VAULT_URL and MAS_VAULT_TOKEN;
# no secret belongs in this checked-in configuration. The configured endpoint
# must be public HTTPS because the guarded client rejects private/metadata DNS.
[secrets.vault]
url = ""
token = ""
namespace = ""
value_field = "value"
# Operators may override deterministic Vault KV-v2 prefixes through env; no
# raw OAuth material is stored in this file or in PostgreSQL.
oauth_pkce_path_prefix = "secret/data/mas/oauth-pkce"
oauth_token_path_prefix = "secret/data/mas/oauth-tokens"

[integrations.inbound_webhooks]
# Two-sided HMAC replay window. Production composition bounds this to 1..=3600.
replay_tolerance_seconds = 300

[integrations.outbound_webhooks]
# mas_integrations durable relay settings. Customer endpoint hostnames are not
# statically allowlisted, but only public HTTPS DNS answers and these reviewed
# ports are allowed. Env list override is MAS_OUTBOUND_WEBHOOK_ALLOWED_PORTS.
poll_seconds = 5
batch_size = 32
lease_seconds = 60
worker_id = "api-outbound-webhook"
allowed_ports = ["443"]
max_response_bytes = 1048576
max_redirects = 3

[integrations.notifications]
# mas_notifications durable delivery settings. Only the closed represented
# in_app adapter is active; unsupported channels fail durably instead of being
# marked delivered.
poll_seconds = 5
batch_size = 32
lease_seconds = 60
worker_id = "api-notification-delivery"

[integrations.oauth]
# Mandatory when any supported OAuth provider client id is configured.
# Env: MAS_OAUTH_CALLBACK_BASE_URL. Must be a public HTTPS API base URL.
callback_base_url = ""
# Each API replica may run fenced cross-tenant refresh, cleanup, and
# materialization-reconciliation loops under the separate mas_oauth_refresh
# role URL. Env: MAS_OAUTH_REFRESH_*.
refresh_poll_seconds = 30
refresh_batch_size = 32
refresh_worker_id = "api-oauth-refresh"
# Callback materialization reconciliation uses a fixed five-minute durable
# grace window before deleting an unbound deterministic OAuth token location.

[integrations.oauth.slack]
# Env: MAS_OAUTH_SLACK_CLIENT_ID / MAS_OAUTH_SLACK_SCOPES
client_id = ""
scopes = ["channels:read", "chat:write"]

[integrations.oauth.salesforce]
# Env: MAS_OAUTH_SALESFORCE_CLIENT_ID / MAS_OAUTH_SALESFORCE_SCOPES
client_id = ""
scopes = ["api", "refresh_token"]

[integrations.oauth.jira]
# Env: MAS_OAUTH_JIRA_CLIENT_ID / MAS_OAUTH_JIRA_SCOPES
client_id = ""
scopes = ["offline_access", "read:jira-user"]

[observability]
log_format = "json"
log_level = "info"
# Scraped by the platform Prometheus; bind to pod IP via env in real deploys.
metrics_addr = "0.0.0.0:9102"
otlp_endpoint = ""

# Identity provider endpoints are explicit HTTPS origins in production. The
# invalid example host intentionally fails closed until replaced at deploy time.
[oidc]
issuer = "https://identity.example.invalid/realms/mas"
# MAS_OIDC_AUDIENCE may pin the access-token audience at deploy time.
audience = ""
jwks_url = "https://identity.example.invalid/realms/mas/protocol/openid-connect/certs"
algs = ["RS256", "ES256"]
clock_skew_seconds = 30
jwks_cache_ttl_seconds = 300
# Bounded remote-key fetch; Env: MAS_OIDC_JWKS_TIMEOUT_MS
jwks_request_timeout_ms = 5000

# SSE resources are bounded per connection and per tenant.
[stream]
heartbeat_ms = 15000
buffer_size = 256
max_connections_per_tenant = 100
# Production SSE bounds: positive heartbeat, finite buffer and per-principal cap.
heartbeat_secs = 15
channel_buffer = 256
max_connections_per_principal = 8

# Dashboard refresh is an operator-controlled background cadence.
[analytics]
rollup_refresh_interval_seconds = 300
rollup_lookback_days = 90

# Upload/crawl limits never grow based on request content.
[data_hub]
max_upload_bytes = 33554432
max_document_bytes = 33554432
max_pages_per_sync = 500
max_crawl_depth = 3
