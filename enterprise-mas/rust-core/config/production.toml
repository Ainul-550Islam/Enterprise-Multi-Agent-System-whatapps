# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION overlay (MAS_ENV=production). Merges over default.toml.
#
# ⚠️  GUARDRAILS — binaries refuse to boot when these hold:
#   * database.url empty           → in-memory fallback is FORBIDDEN here
#   * server.dev_tokens non-empty  → static tokens are a dev/test artifact
#   * scheduler.api_bearer set     → production service auth comes from env
#     MAS_SCHEDULER_API_TOKEN directly, never from a checked-in file
#   * metrics listener public      → scraping endpoint must not be world-open
#
# Everything below is sized for a medium single-region deployment; tune per
# SLO measurements (benches/ has the throughput floor):
#   * api p99 submit+start               <  250 ms
#   * scheduler tick drain (100 due)     <  1 s
#   * worker settle latency (steady)     <  50 ms / msg
# ─────────────────────────────────────────────────────────────────────────────
environment = "production"

[server]
http_addr = "0.0.0.0:8080"
grpc_addr = "0.0.0.0:50051"
body_limit_kib = 256
dev_tokens = ""

[scheduler]
# Behind an internal LB: only this host's loopback is too tight for probes,
# but the completion route is internal-plane; protect with network policy.
completion_addr = "0.0.0.0:8090"
replica_id = "scheduler-prod-1"
tick_interval_ms = 5000
recover_on_start = true
error_backoff_cap_ms = 60000
# api_base_url comes from MAS_SCHEDULER_API_URL (service discovery insert).

[worker]
consumer_name = "tasks-prod"
batch_size = 25
ack_wait_ms = 30000
poll_interval_ms = 100
lease_ttl_ms = 45000
max_in_flight = 64
drain_timeout_ms = 60000
worker_name = "worker-prod-1"
# The production worker is a real AI execution worker, not an empty consumer.
# Bridge endpoint/token/signing key are supplied via the MAS_AI_BRIDGE_* env vars.
handlers = "execution.run"
retry_base_ms = 500
retry_cap_ms = 30000
retry_max_deliver = 10

[database]
# Empty here on purpose: production reads MAS_DATABASE_URL from env; the
# guardrail above stops boot without it.
url = ""
max_connections = 32
connect_timeout_ms = 5000

[observability]
log_format = "json"
log_level = "info"
# Scraped by the platform Prometheus; bind to pod IP via env in real deploys.
metrics_addr = "0.0.0.0:9102"
otlp_endpoint = ""

# Identity provider endpoints are explicit HTTPS origins in production. The
# invalid example host intentionally fails closed until replaced at deploy time.
[oidc]
issuer = "https://identity.example.invalid/realms/mas"
jwks_url = "https://identity.example.invalid/realms/mas/protocol/openid-connect/certs"
algs = ["RS256", "ES256"]
clock_skew_seconds = 30
jwks_cache_ttl_seconds = 300

# SSE resources are bounded per connection and per tenant.
[stream]
heartbeat_ms = 15000
buffer_size = 256
max_connections_per_tenant = 100

# Dashboard refresh is an operator-controlled background cadence.
[analytics]
rollup_refresh_interval_seconds = 300
rollup_lookback_days = 90

# Upload/crawl limits never grow based on request content.
[data_hub]
max_upload_bytes = 33554432
max_document_bytes = 33554432
max_pages_per_sync = 500
max_crawl_depth = 3
