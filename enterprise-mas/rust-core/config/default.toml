# ─────────────────────────────────────────────────────────────────────────────
# MAS runtime configuration — DEFAULT layer.
#
# Precedence (LATER WINS):
#   1. config/default.toml            (this file — checked in, never secrets)
#   2. config/{MAS_ENV}.toml          (development | test | production)
#   3. environment variables          (names documented per key below)
#   4. process CLI flags              (--flag, where the binary supports one)
#
# Rules:
#   * No secrets in this file. Anything sensitive is EMPTY here and MUST be
#     supplied by env (or the platform's secret manager → env).
#   * Durations are plain integers with a unit suffix baked into the key name
#     (`*_ms`); addresses are `host:port` strings.
#   * Every key in this file is the schema: environment overlays override
#     selectively (whole tables are replaced, file-level merge is deep).
#   * Databases/queues are absent on purpose: binaries refuse to start without
#     their dev flag until Postgres/NATS adapters land (fail closed, not silent).
# ─────────────────────────────────────────────────────────────────────────────

# Which environment overlay gets merged on top of this file. Overridden by the
# MAS_ENV environment variable (constants: development|test|production).
environment = "development"

# ── mas-api (HTTP + gRPC front end) ──────────────────────────────────────────
[server]
# Env: MAS_API_HTTP_ADDR
http_addr = "0.0.0.0:8080"
# Env: MAS_API_GRPC_ADDR
grpc_addr = "0.0.0.0:50051"
# Per-request body cap in KiB (mirrors the router's 256KiB default).
body_limit_kib = 256
# Static dev token table `token:subject:kind,...` — dev overlay ONLY; the
# env var MAS_DEV_TOKENS wins and production must leave this empty.
dev_tokens = ""

# ── mas-scheduler (completion listener + tick driver) ───────────────────────
[scheduler]
# Completion listener bind. Production requires an explicit private-network
# value. Env: MAS_SCHEDULER_COMPLETION_ADDR
completion_addr = "127.0.0.1:8090"
# Shared v2 signing secret. Set only through the secret manager/environment.
# Env: MAS_INTERNAL_SERVICE_SECRET
internal_service_secret = ""
# Replica identity (lease holder name). Env: MAS_SCHEDULER_REPLICA_ID
replica_id = "scheduler-1"
# Tick interval. Env: MAS_SCHEDULER_INTERVAL_MS
tick_interval_ms = 1000
# Startup recovery (reap dead leases + requeue overdue work).
recover_on_start = true
# Consecutive-tick-error backoff ceiling.
error_backoff_cap_ms = 30000
# Dispatch target: `http(s)://…` → HttpDispatcher; empty → dev loopback.
# Env: MAS_SCHEDULER_API_URL
api_base_url = ""
# Service token for the schedule-run endpoint; NEVER set in files on
# production (see production.toml). Env: MAS_SCHEDULER_API_TOKEN.
api_bearer = ""

# ── mas-worker (queue consumer) ─────────────────────────────────────────────
[worker]
# Durable consumer name. Env: MAS_WORKER_CONSUMER
consumer_name = "tasks-main"
# Subject filter for tasks. Env: MAS_WORKER_FILTER
subject_filter = "mas.tasks.>"
# Messages per fetch batch.
batch_size = 10
# Broker ack window: a message unacked within this returns for redelivery.
ack_wait_ms = 30000
# Poll cadence when the queue is idle. Env: MAS_WORKER_POLL_MS
poll_interval_ms = 250
# Task lease TTL (renewed at heartbeat rate ack_wait/2).
lease_ttl_ms = 30000
# In-flight handler concurrency cap.
max_in_flight = 16
# Graceful-shutdown drain budget before in-flight work is abandoned.
drain_timeout_ms = 30000
# Worker identity (lease holder name). Env: MAS_WORKER_NAME
worker_name = "worker-1"
# Retry policy: exponential backoff with full jitter.
retry_base_ms = 250
retry_cap_ms = 10000
retry_max_deliver = 8

# ── Rust → Python AI bridge ──────────────────────────────────────────────────
[ai_bridge]
# Endpoint is deliberately empty: execution.run refuses to boot until it is
# configured explicitly. Production must use https://.
# Env: MAS_AI_BRIDGE_ENDPOINT
endpoint = ""
# Secret-manager values are env-only; never populate these in checked-in TOML.
# Env: MAS_AI_BRIDGE_TOKEN
token = ""
# Shared with Python security.internal_service_secret_ref.
# Env: MAS_AI_BRIDGE_INTERNAL_SIGNING_SECRET
internal_signing_secret = ""
# Optional PEM CA for private bridge PKI; otherwise OS/WebPKI roots are used.
# Env: MAS_AI_BRIDGE_TLS_CA_CERTIFICATE_PATH
tls_ca_certificate_path = ""
# Optional mTLS client identity, both paths required together.
# Env: MAS_AI_BRIDGE_TLS_CLIENT_CERTIFICATE_PATH / MAS_AI_BRIDGE_TLS_CLIENT_PRIVATE_KEY_PATH
tls_client_certificate_path = ""
tls_client_private_key_path = ""
# RPC bound settings. Env: MAS_AI_BRIDGE_TIMEOUT_MS / MAS_AI_BRIDGE_MAX_RESPONSE_BYTES
timeout_ms = 120000
max_response_bytes = 8388608

# ── persistence (currently in-memory everywhere) ────────────────────────────
[database]
# Empty is *deliberate*: it selects in-memory stores which binaries refuse
# outside `--dev-inmemory`. Env: MAS_DATABASE_URL
url = ""
# Separate least-privilege machine-plane DSNs. Production scheduler/worker
# composition refuses to fall back to `url` for these cross-tenant roles.
# Env: MAS_DATABASE_SCHEDULER_URL / MAS_DATABASE_WORKER_URL
scheduler_url = ""
worker_url = ""
# Public inbound-webhook callback and secret-reference relay pools. Production
# requires dedicated role URLs; no callback falls back to mas_app.
# Env: MAS_DATABASE_INBOUND_URL / MAS_DATABASE_INTEGRATIONS_URL /
# MAS_DATABASE_NOTIFICATIONS_URL / MAS_DATABASE_OAUTH_URL /
# MAS_DATABASE_OAUTH_REFRESH_URL
inbound_url = ""
integrations_url = ""
# Durable cross-tenant notification delivery requires mas_notifications and
# never falls back to mas_app or the integrations relay role.
notifications_url = ""
# OAuth callback state consumes before a tenant can be known, so this must be a
# separate mas_oauth role URL and must never fall back to database.url.
oauth_url = ""
# OAuth refresh, external-token cleanup, and callback-materialization
# reconciliation scan durable cross-tenant leases under an even narrower
# mas_oauth_refresh role; it must never reuse a callback/request role URL.
oauth_refresh_url = ""
max_connections = 10
connect_timeout_ms = 5000

# ── external secret manager (inbound webhook signing keys) ─────────────────
# Values remain empty in source control. The public callback process fails
# closed until operator-supplied Vault configuration is present.
[secrets.vault]
# Env: MAS_VAULT_URL / MAS_VAULT_TOKEN / MAS_VAULT_NAMESPACE
url = ""
token = ""
namespace = ""
value_field = "value"
# Operator-owned KV-v2 API path prefixes for deterministic OAuth material.
# Env: MAS_VAULT_OAUTH_PKCE_PATH_PREFIX / MAS_VAULT_OAUTH_TOKEN_PATH_PREFIX
# Token and PKCE bytes are never placed in this file or in PostgreSQL.
oauth_pkce_path_prefix = "secret/data/mas/oauth-pkce"
oauth_token_path_prefix = "secret/data/mas/oauth-tokens"

[integrations.inbound_webhooks]
# Two-sided signature replay tolerance. Production composition enforces 1..=3600.
# Env: MAS_INBOUND_WEBHOOK_REPLAY_TOLERANCE_SECONDS
replay_tolerance_seconds = 300

# A dedicated mas_integrations relay claims/sends durable outbound webhook
# deliveries. Customer domains are intentionally not host-allowlisted, but
# public HTTPS, reviewed ports, pinned DNS, private/metadata blocking, bounded
# response bodies, and redirect-hop revalidation are always enforced.
[integrations.outbound_webhooks]
# Env: MAS_OUTBOUND_WEBHOOK_POLL_SECONDS / MAS_OUTBOUND_WEBHOOK_BATCH_SIZE /
# MAS_OUTBOUND_WEBHOOK_LEASE_SECONDS / MAS_OUTBOUND_WEBHOOK_WORKER_ID
poll_seconds = 5
batch_size = 32
lease_seconds = 60
worker_id = "api-outbound-webhook"
# Env: MAS_OUTBOUND_WEBHOOK_ALLOWED_PORTS (comma-separated),
# MAS_OUTBOUND_WEBHOOK_MAX_RESPONSE_BYTES, MAS_OUTBOUND_WEBHOOK_MAX_REDIRECTS
allowed_ports = ["443"]
max_response_bytes = 1048576
max_redirects = 3

# A separately privileged mas_notifications worker delivers only represented
# channels. At present in_app is represented; unimplemented email/slack/webhook
# rows remain durable retry/dead-letter evidence instead of fake successes.
[integrations.notifications]
# Env: MAS_NOTIFICATION_DELIVERY_POLL_SECONDS /
# MAS_NOTIFICATION_DELIVERY_BATCH_SIZE / MAS_NOTIFICATION_DELIVERY_LEASE_SECONDS /
# MAS_NOTIFICATION_DELIVERY_WORKER_ID
poll_seconds = 5
batch_size = 32
lease_seconds = 60
worker_id = "api-notification-delivery"

[integrations.oauth]
# Public HTTPS API origin/path prefix used to derive fixed provider callbacks.
# Env: MAS_OAUTH_CALLBACK_BASE_URL. Empty source config is deliberate: a
# durable production API refuses startup until an operator supplies it.
callback_base_url = ""
# Durable OAuth lifecycle worker settings. Each API replica may run refresh,
# cleanup, and materialization reconciliation loops because PostgreSQL
# leases/fences serialize settlement across replicas.
# Env: MAS_OAUTH_REFRESH_POLL_SECONDS / MAS_OAUTH_REFRESH_BATCH_SIZE /
# MAS_OAUTH_REFRESH_WORKER_ID
refresh_poll_seconds = 30
refresh_batch_size = 32
refresh_worker_id = "api-oauth-refresh"
# Callback materialization reconciliation uses a fixed five-minute durable
# grace window before deleting an unbound deterministic OAuth token location.

[integrations.oauth.slack]
# Public OAuth client id only; client secrets are intentionally unsupported.
# Env: MAS_OAUTH_SLACK_CLIENT_ID / MAS_OAUTH_SLACK_SCOPES
client_id = ""
scopes = ["channels:read", "chat:write"]

[integrations.oauth.salesforce]
# Env: MAS_OAUTH_SALESFORCE_CLIENT_ID / MAS_OAUTH_SALESFORCE_SCOPES
client_id = ""
scopes = ["api", "refresh_token"]

[integrations.oauth.jira]
# Env: MAS_OAUTH_JIRA_CLIENT_ID / MAS_OAUTH_JIRA_SCOPES
client_id = ""
scopes = ["offline_access", "read:jira-user"]

# ── telemetry ───────────────────────────────────────────────────────────────
[observability]
# log output format: `json` | `pretty`. Env: MAS_LOG_FORMAT
log_format = "json"
# tracing filter directive. Env: MAS_LOG_LEVEL / RUST_LOG
log_level = "info,mas=debug"
# OTLP exporter endpoint (empty = no export). Env: MAS_OTLP_ENDPOINT
otlp_endpoint = ""
# Metrics listener (empty = disabled). Env: MAS_METRICS_ADDR
metrics_addr = ""

# ── OIDC resource-server verification ───────────────────────────────────────
[oidc]
# Issuer and JWKS endpoint for interactive-user JWTs. Development may use a
# local IdP; production overrides both with the deployment's trusted HTTPS IdP.
issuer = "http://127.0.0.1:8081/realms/mas"
# Optional API audience pin. Env: MAS_OIDC_AUDIENCE
audience = ""
jwks_url = "http://127.0.0.1:8081/realms/mas/protocol/openid-connect/certs"
# Asymmetric IdP algorithms only; HS256 remains reserved for internal tokens.
algs = ["RS256", "ES256"]
clock_skew_seconds = 60
jwks_cache_ttl_seconds = 300
# Bounded remote-key fetch; Env: MAS_OIDC_JWKS_TIMEOUT_MS
jwks_request_timeout_ms = 5000

# ── Server-sent event stream bounds ─────────────────────────────────────────
[stream]
heartbeat_ms = 15000
buffer_size = 256
max_connections_per_tenant = 100
# Typed SSE bounds consumed by mas-common::config::StreamConfig.
heartbeat_secs = 15
channel_buffer = 256
max_connections_per_principal = 8

# ── Analytics rollup refresh ─────────────────────────────────────────────────
[analytics]
rollup_refresh_interval_seconds = 300
rollup_lookback_days = 90

# ── Data Hub ingestion bounds ────────────────────────────────────────────────
[data_hub]
max_upload_bytes = 33554432
max_document_bytes = 33554432
max_pages_per_sync = 500
max_crawl_depth = 3
