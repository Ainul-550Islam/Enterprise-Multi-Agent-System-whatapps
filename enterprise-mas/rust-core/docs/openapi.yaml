  # ── stream ───────────────────────────────────────────────────────
  /v1/stream:
    get:
      tags: [tooling]
      summary: SSE event stream (text/event-stream)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer API key or JWT.

  parameters:
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    RecipientId:
      name: recipient_id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        type: string
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    Granularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [hour, day, week]
    Dimension:
      name: dimension
      in: query
      required: false
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    PlanCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    Feature:
      name: feature
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
    LastEventId:
      name: Last-Event-Id
      in: header
      required: false
      schema:
        type: string

  requestBodies:
    RawBody:
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Organization:
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
    Tenant:
      content:
        application/json:
          schema:
            type: object
            required: [name, organization_id]
            properties:
              name:
                type: string
              organization_id:
                type: string
    Project:
      content:
        application/json:
          schema:
            type: object
            required: [name, tenant_id]
            properties:
              name:
                type: string
              tenant_id:
                type: string
    User:
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
    Membership:
      content:
        application/json:
          schema:
            type: object
            required: [user_id, tenant_id, role]
            properties:
              user_id:
                type: string
              tenant_id:
                type: string
              role:
                type: string
    Agent:
      content:
        application/json:
          schema:
            type: object
            required: [name, project_id]
            properties:
              name:
                type: string
              project_id:
                type: string
    AgentVersion:
      content:
        application/json:
          schema:
            type: object
            required: [configuration_checksum, configuration_snapshot]
            properties:
              configuration_checksum:
                type: string
              configuration_snapshot:
                type: object
    Rollback:
      content:
        application/json:
          schema:
            type: object
            required: [target_version_number]
            properties:
              target_version_number:
                type: integer
    CreateApiKey:
      content:
        application/json:
          schema:
            type: object
            required: [name, scopes]
            properties:
              name:
                type: string
              scopes:
                type: array
                items:
                  type: string
              expires_at:
                type: string
                format: date-time
    RotateApiKey:
      content:
        application/json:
          schema:
            type: object
            properties:
              grace_seconds:
                type: integer
    Connector:
      content:
        application/json:
          schema:
            type: object
            required: [provider, name]
            properties:
              provider:
                type: string
              name:
                type: string
    TestConnector:
      content:
        application/json:
          schema:
            type: object
    RegisterWebhook:
      content:
        application/json:
          schema:
            type: object
            required: [url, subscribed_events, secret_reference_id]
            properties:
              url:
                type: string
              subscribed_events:
                type: array
                items:
                  type: string
              secret_reference_id:
                type: string
              description:
                type: string
    RegisterInboundWebhook:
      content:
        application/json:
          schema:
            type: object
            required: [url, secret_reference_id]
            properties:
              url:
                type: string
              secret_reference_id:
                type: string
    Workflow:
      content:
        application/json:
          schema:
            type: object
            required: [name, project_id]
            properties:
              name:
                type: string
              project_id:
                type: string
    WorkflowGraph:
      content:
        application/json:
          schema:
            type: object
    SubmitExecution:
      content:
        application/json:
          schema:
            type: object
            required: [agent_id]
            properties:
              workflow_id:
                type: string
              agent_id:
                type: string
              input:
                type: object
              correlation_id:
                type: string
              idempotency_key:
                type: string
    Schedule:
      content:
        application/json:
          schema:
            type: object
            required: [name, cron]
            properties:
              name:
                type: string
              cron:
                type: string
    DataSource:
      content:
        application/json:
          schema:
            type: object
            required: [name, kind]
            properties:
              name:
                type: string
              kind:
                type: string
    DocumentUpload:
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    Policy:
      content:
        application/json:
          schema:
            type: object
            required: [name, definition]
            properties:
              name:
                type: string
              definition:
                type: object
    UpdatePolicy:
      content:
        application/json:
          schema:
            type: object
    Plan:
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
    Tool:
      content:
        application/json:
          schema:
            type: object
            required: [name, kind, project_id]
            properties:
              name:
                type: string
              kind:
                type: string
              project_id:
                type: string
    UpdateTool:
      content:
        application/json:
          schema:
            type: object
    ReplaceToolPermissions:
      content:
        application/json:
          schema:
            type: object
            required: [grants]
            properties:
              grants:
                type: array

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
              error:
                type: object
              meta:
                $ref: '#/components/schemas/EnvelopeMeta'
    OkList:
      description: Success list
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
              error:
                type: object
              meta:
                $ref: '#/components/schemas/EnvelopeMeta'
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
              error:
                type: object
              meta:
                $ref: '#/components/schemas/EnvelopeMeta'
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
              error:
                type: object
              meta:
                $ref: '#/components/schemas/EnvelopeMeta'
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error, meta]
            properties:
              data:
                type: object
              error:
                $ref: '#/components/schemas/StableApiError'
              meta:
                $ref: '#/components/schemas/EnvelopeMeta'

  schemas:
    StableApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
    EnvelopeMeta:
      type: object
      required: [request_id, correlation_id, api_version, responded_at]
      properties:
        request_id:
          type: string
        correlation_id:
          type: string
        api_version:
          type: string
        responded_at:
          type: string
          format: date-time
