openapi: 3.1.0
info:
  title: Enterprise MAS API
  description: |
    Tenant-facing HTTP v1 API for enterprise-mas. Every route answers the
    stable envelope `ApiEnvelope { data | StableApiError, meta }`; bearer JWT
    or API-key authentication on protected routes; SSE (`text/event-stream`)
    for `/v1/stream`; keyset pagination on list endpoints.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
    description: local dev
  - url: https://api.mas.example.com
    description: production
tags:
  - name: health
  - name: tenancy
  - name: agents
  - name: approvals
  - name: api-keys
  - name: notifications
  - name: connectors
  - name: webhooks
  - name: inbound-webhooks
  - name: workflows
  - name: executions
  - name: schedules
  - name: search
  - name: data-hub
  - name: analytics
  - name: billing
  - name: admin
  - name: governance
  - name: tooling
  - name: public
paths:
  # ── health (public) ──────────────────────────────────────────────
  /v1/health/live:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── public callbacks ─────────────────────────────────────────────
  /v1/public/inbound-webhooks/{route_id}:
    post:
      tags: [public]
      summary: Public inbound webhook ingestion (HMAC-verified, no user auth)
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        $ref: '#/components/requestBodies/RawBody'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
  /v1/public/oauth/{provider}/callback:
    get:
      tags: [public]
      summary: OAuth provider callback (opaque one-shot state)
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '302':
          description: Redirect to callback target
        '400':
          $ref: '#/components/responses/Error'

  # ── tenancy ──────────────────────────────────────────────────────
  /v1/organizations:
    get:
      tags: [tenancy]
      summary: List organizations
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [tenancy]
      summary: Register organization
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Organization'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/Error'
  /v1/tenants:
    get:
      tags: [tenancy]
      summary: List tenants
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [tenancy]
      summary: Register tenant
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Tenant'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/projects:
    post:
      tags: [tenancy]
      summary: Register project
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Project'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/users:
    post:
      tags: [tenancy]
      summary: Register user
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/User'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/memberships:
    post:
      tags: [tenancy]
      summary: Invite membership
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Membership'
      responses:
        '201':
          $ref: '#/components/responses/Created'

  # ── agents ───────────────────────────────────────────────────────
  /v1/agents:
    get:
      tags: [agents]
      summary: List agents
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [agents]
      summary: Register agent
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Agent'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/agents/{agent_id}:
    get:
      tags: [agents]
      summary: Get agent
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/Error'
  /v1/agents/{agent_id}/versions:
    get:
      tags: [agents]
      summary: List agent versions
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [agents]
      summary: Publish agent version
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        $ref: '#/components/requestBodies/AgentVersion'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/agents/{agent_id}/versions/{version}/rollback:
    post:
      tags: [agents]
      summary: Rollback agent version
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        $ref: '#/components/requestBodies/Rollback'
      responses:
        '201':
          $ref: '#/components/responses/Created'

  # ── approvals ────────────────────────────────────────────────────
  /v1/approvals:
    get:
      tags: [approvals]
      summary: List approvals
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/approvals/{id}/approve:
    post:
      tags: [approvals]
      summary: Approve
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/approvals/{id}/deny:
    post:
      tags: [approvals]
      summary: Deny
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── api keys ─────────────────────────────────────────────────────
  /v1/api-keys:
    get:
      tags: [api-keys]
      summary: List API keys (metadata only)
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [api-keys]
      summary: Create API key (raw key returned once)
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/CreateApiKey'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/Error'
  /v1/api-keys/{id}/revoke:
    post:
      tags: [api-keys]
      summary: Revoke API key
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/api-keys/{id}/rotate:
    post:
      tags: [api-keys]
      summary: Rotate API key
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/RotateApiKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── notifications ────────────────────────────────────────────────
  /v1/notifications/recipients/{recipient_id}:
    get:
      tags: [notifications]
      summary: List notifications for recipient
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RecipientId'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/notifications/recipients/{recipient_id}/{notification_id}/read:
    post:
      tags: [notifications]
      summary: Mark notification read
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RecipientId'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/notifications/recipients/{recipient_id}/{notification_id}/archive:
    post:
      tags: [notifications]
      summary: Archive notification
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RecipientId'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── connectors ───────────────────────────────────────────────────
  /v1/connectors:
    get:
      tags: [connectors]
      summary: List connectors
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [connectors]
      summary: Register connector
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Connector'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/connectors/test:
    post:
      tags: [connectors]
      summary: Test connector
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/TestConnector'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/connectors/{connector_id}:
    get:
      tags: [connectors]
      summary: Get connector
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/connectors/{connector_id}/oauth/authorize:
    post:
      tags: [connectors]
      summary: OAuth authorization initiation
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/connectors/{connector_id}/probe:
    post:
      tags: [connectors]
      summary: Probe connector
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/connectors/{connector_id}/disable:
    post:
      tags: [connectors]
      summary: Disable connector
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── webhooks ─────────────────────────────────────────────────────
  /v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [webhooks]
      summary: Register webhook
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/RegisterWebhook'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/webhooks/{webhook_id}/enable:
    post:
      tags: [webhooks]
      summary: Enable webhook
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/webhooks/{webhook_id}/disable:
    post:
      tags: [webhooks]
      summary: Disable webhook
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      summary: List webhook deliveries
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/webhooks/{id}/deliveries/{delivery_id}/replay:
    post:
      tags: [webhooks]
      summary: Replay webhook delivery
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── inbound webhooks ─────────────────────────────────────────────
  /v1/inbound-webhooks:
    get:
      tags: [inbound-webhooks]
      summary: List inbound webhook endpoints
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [inbound-webhooks]
      summary: Register inbound webhook endpoint
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/RegisterInboundWebhook'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/inbound-webhooks/{endpoint_id}:
    get:
      tags: [inbound-webhooks]
      summary: Get inbound webhook endpoint
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/inbound-webhooks/{endpoint_id}/enable:
    post:
      tags: [inbound-webhooks]
      summary: Enable inbound webhook endpoint
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/inbound-webhooks/{endpoint_id}/disable:
    post:
      tags: [inbound-webhooks]
      summary: Disable inbound webhook endpoint
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── workflows ────────────────────────────────────────────────────
  /v1/workflows:
    get:
      tags: [workflows]
      summary: List workflows
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [workflows]
      summary: Create workflow
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Workflow'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/workflows/{workflow_id}:
    get:
      tags: [workflows]
      summary: Get workflow
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/workflows/{workflow_id}/graph:
    put:
      tags: [workflows]
      summary: Update workflow graph
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        $ref: '#/components/requestBodies/WorkflowGraph'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/workflows/{workflow_id}/publish:
    post:
      tags: [workflows]
      summary: Publish workflow
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/workflows/{workflow_id}/disable:
    post:
      tags: [workflows]
      summary: Disable workflow
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/workflows/{workflow_id}/versions:
    get:
      tags: [workflows]
      summary: List workflow versions
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/workflows/{workflow_id}/versions/{version}/rollback:
    post:
      tags: [workflows]
      summary: Rollback workflow version
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        $ref: '#/components/requestBodies/Rollback'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/rollbacks:
    get:
      tags: [workflows]
      summary: List rollback history
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'

  # ── executions ───────────────────────────────────────────────────
  /v1/projects/{project_id}/executions:
    post:
      tags: [executions]
      summary: Submit execution (idempotent)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/SubmitExecution'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '409':
          $ref: '#/components/responses/Error'
  /v1/executions:
    get:
      tags: [executions]
      summary: List executions
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/executions/{execution_id}:
    get:
      tags: [executions]
      summary: Get execution
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/Error'
  /v1/executions/{execution_id}/steps:
    get:
      tags: [executions]
      summary: Get execution steps timeline
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/executions/{execution_id}/start:
    post:
      tags: [executions]
      summary: Start execution
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/executions/{execution_id}/pause:
    post:
      tags: [executions]
      summary: Pause execution
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/executions/{execution_id}/resume:
    post:
      tags: [executions]
      summary: Resume execution
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/executions/{execution_id}/cancel:
    post:
      tags: [executions]
      summary: Cancel execution
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── schedules ────────────────────────────────────────────────────
  /v1/schedules:
    get:
      tags: [schedules]
      summary: List schedules
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [schedules]
      summary: Register schedule
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/Schedule'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/schedules/{schedule_id}:
    get:
      tags: [schedules]
      summary: Get schedule
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/schedules/{schedule_id}/pause:
    post:
      tags: [schedules]
      summary: Pause schedule
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/schedules/{schedule_id}/resume:
    post:
      tags: [schedules]
      summary: Resume schedule
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/schedules/{schedule_id}/disable:
    post:
      tags: [schedules]
      summary: Disable schedule
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── search ───────────────────────────────────────────────────────
  /v1/search:
    get:
      tags: [search]
      summary: Command palette search
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          $ref: '#/components/responses/OkList'

  # ── data hub ─────────────────────────────────────────────────────
  /v1/data-sources:
    get:
      tags: [data-hub]
      summary: List data sources
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkList'
    post:
      tags: [data-hub]
      summary: Create data source
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/DataSource'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/data-sources/{id}:
    get:
      tags: [data-hub]
      summary: Get data source
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/data-sources/{id}/sync:
    post:
      tags: [data-hub]
      summary: Sync data source
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
  /v1/data-sources/{id}/documents:
    get:
      tags: [data-hub]
      summary: List documents
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/OkList'
  /v1/documents/upload:
    post:
      tags: [data-hub]
      summary: Upload document (bounded multipart)
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/DocumentUpload'
      responses:
        '201':
          $ref: '#/components/responses/Created'
  /v1/documents/{id}:
    get:
      tags: [data-hub]
      summary: Get document
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [data-hub]
      summary: Delete document
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  # ── analytics ────────────────────────────────────────────────────
  /v1/analytics/overview:
    get:
      tags: [analytics]
      summary: Analytics overview (KPI cards)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/From'
