# values.yaml — enterprise-mas Helm chart
# All secrets are references (existingSecret names) only; no raw values.

image:
  registry: ""
  repository: enterprise-mas
  tag: local
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  image: api
  httpAddr: 0.0.0.0:8080
  grpcAddr: 0.0.0.0:50051
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    liveness:
      path: /v1/health/live
      port: 8080
    readiness:
      path: /v1/health/ready
      port: 8080

worker:
  replicaCount: 2
  image: worker
  consumerName: tasks-prod
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 250m
      memory: 512Mi

scheduler:
  replicaCount: 1   # leases/leader semantics: one active scheduler
  image: scheduler
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

orchestrator:
  replicaCount: 2
  image: orchestrator
  bindPort: 9100
  grpcPort: 9100
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 250m
      memory: 512Mi

migrate:
  image: migrate
  command: ["up"]
  # Fails the pre-install/pre-upgrade hook rather than hanging the release. A
  # hook that never returns blocks the install and holds the schema advisory
  # lock while it waits.
  activeDeadlineSeconds: 600
  # Retried once, not indefinitely: a real schema conflict is not fixed by
  # retrying, and a flapping migration is worse than a failed one.
  backoffLimit: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# External infrastructure references (operator-provided).
postgres:
  host: postgres.mas.svc.cluster.local
  port: 5432
  db: mas_live
  existingSecret: mas-postgres-credentials   # contains MAS_DATABASE_URL etc.

nats:
  host: nats.mas.svc.cluster.local
  port: 4222
  existingSecret: mas-nats-credentials

# Provider mode default: disabled (production must enable explicitly).
providers:
  mode: disabled
  enabledProviders: []
  allowedModels: []

# Ingress off by default.
ingress:
  enabled: false
  class: nginx
  # Public hostname for the api. Required when ingress.enabled=true; the chart
  # refuses to render without it rather than falling back to a placeholder that
  # would silently route nothing.
  host: api.mas.example.com
  tls:
    enabled: false
  # cert-manager ClusterIssuer used when tls.enabled=true.
  clusterIssuer: letsencrypt-prod

# Security context (hardened, applied to all workloads).
# Pod-level context. Only fields the PodSecurityContext API defines may appear
# here; crucially *not* readOnlyRootFilesystem / allowPrivilegeEscalation /
# capabilities, which are container-level. Shipping those here made every
# rendered manifest invalid — the API server rejects the pod spec outright.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level context, applied to every container in every workload.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: ["ALL"]

# HPA disabled by default (opt-in flag).
hpa:
  enabled: false
  apiMinReplicas: 2
  apiMaxReplicas: 10
  workerMinReplicas: 2
  workerMaxReplicas: 20
  targetCPUUtilizationPercentage: 70

# NetworkPolicy set. Enabled by default: the release ships a default-deny and
# then allows only the flows each workload needs (DNS, data plane, bridge).
networkPolicy:
  enabled: true
  # Namespace holding the ingress controller that fronts the api Service.
  ingressNamespace: ingress-nginx
  # Namespace holding PostgreSQL and NATS. Both are external to this chart.
  dataNamespace: mas-data
