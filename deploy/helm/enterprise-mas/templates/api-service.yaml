apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-mas.fullname" . }}-api
  labels:
    {{- include "enterprise-mas.labels" . | nindent 4 }}
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 50051
      targetPort: grpc
      name: grpc
  selector:
    {{- include "enterprise-mas.selectorLabels" . | nindent 4 }}
    component: api
