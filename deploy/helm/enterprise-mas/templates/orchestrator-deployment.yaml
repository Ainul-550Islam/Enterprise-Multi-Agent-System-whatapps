apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-mas.fullname" . }}-orchestrator
  labels:
    {{- include "enterprise-mas.labels" . | nindent 4 }}
    component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "enterprise-mas.selectorLabels" . | nindent 6 }}
      component: orchestrator
  template:
    metadata:
      labels:
        {{- include "enterprise-mas.selectorLabels" . | nindent 8 }}
        component: orchestrator
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-{{ .Values.orchestrator.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 14 }}
          ports:
            - containerPort: 9100
              name: grpc
          env:
            - name: MAS_ENV
              value: "production"
            - name: MAS_ORCHESTRATOR_BIND_PORT
              value: "9100"
            - name: MAS_PROVIDERS_MODE
              value: "{{ .Values.providers.mode }}"
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.existingSecret }}
            - secretRef:
                name: {{ .Values.nats.existingSecret }}
          # gRPC private port only — ClusterIP service, never exposed by ingress.
          # The orchestrator serves gRPC only on 9100; there is no HTTP health
          # surface to probe. A TCP check on the gRPC port is the closest honest
          # liveness signal, and it fails when the listener has died even if the
          # interpreter is still resident.
          livenessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
