apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-mas.fullname" . }}-orchestrator
  labels:
    {{- include "enterprise-mas.labels" . | nindent 4 }}
    component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "enterprise-mas.selectorLabels" . | nindent 6 }}
      component: orchestrator
  template:
    metadata:
      labels:
        {{- include "enterprise-mas.selectorLabels" . | nindent 8 }}
        component: orchestrator
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}-{{ .Values.orchestrator.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9100
              name: grpc
          env:
            - name: MAS_ENV
              value: "production"
            - name: MAS_ORCHESTRATOR_BIND_PORT
              value: "9100"
            - name: MAS_PROVIDERS_MODE
              value: "{{ .Values.providers.mode }}"
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.existingSecret }}
            - secretRef:
                name: {{ .Values.nats.existingSecret }}
          # gRPC private port only — ClusterIP service, never exposed by ingress.
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
