{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-mas.fullname" . }}-web
  labels:
    {{- include "enterprise-mas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "enterprise-mas.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "enterprise-mas.name" . }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MAS_API_URL
              value: {{ .Values.web.apiBaseUrl | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            {{- if .Values.web.existingSecret }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.existingSecret }}
                  key: SESSION_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.existingSecret }}
                  key: OIDC_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- if .Values.web.oidcIssuer }}
            - name: OIDC_ISSUER
              value: {{ .Values.web.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.web.oidcClientId | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-mas.fullname" . }}-web
  labels:
    {{- include "enterprise-mas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "enterprise-mas.name" . }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
