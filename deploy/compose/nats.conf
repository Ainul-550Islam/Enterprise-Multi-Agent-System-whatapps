# nats.conf — NATS configuration matching crates/messaging subjects/streams
# (see enterprise-mas/rust-core/docs/nats-wiring.md). JetStream enabled with
# bounds. Stream MAS_TASKS covers mas.tasks.>; volatile event fan-out
# (mas.events.>) remains the in-process fallback in this phase.

listen: "0.0.0.0:4222"

jetstream {
  max_memory: 256MB
  max_store: 1GB
}

# Stream for durable task delivery (worker-service consumes mas.tasks.>)
stream {
  name: MAS_TASKS
  subjects: ["mas.tasks.>"]
  retention: limits
  max_msgs: 1000000
  max_bytes: 10GB
  max_age: 72h
  replicas: 1
}

# Dead-letter subject for exceeded deliveries (adapter publishes here before
# terminal-acking; JetStream has no native DLQ).
stream {
  name: MAS_DLQ
  subjects: ["mas.tasks.dlq"]
  retention: limits
  max_msgs: 100000
  max_bytes: 1GB
  max_age: 72h
  replicas: 1
}

# Volatile event fan-out (non-durable in this phase).
stream {
  name: MAS_EVENTS
  subjects: ["mas.events.>"]
  retention: workqueue
  max_msgs: 100000
  replicas: 1
}

# Client limits.
max_conn: 10000
max_payload: 8MB

# Operator account (no auth in local dev; production binds an operator + users).
accounts {
  default {
    users = [
      { user: "operator", password: "dev-password" }
    ]
    permissions {
      publish {
        allow: ["mas.tasks.>", "mas.events.>", "mas.tasks.dlq"]
      }
      subscribe {
        allow: ["mas.tasks.>", "mas.events.>", "mas.tasks.dlq"]
      }
    }
  }
}
